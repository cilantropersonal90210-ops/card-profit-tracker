<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Profit Analytics</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>Card Profit Tracker</h1>
<p>Track your cards, purchases, sales, and grading potential.</p>
</header>

<main>

<section class="dashboard">

    <div class="stat-card">
        <h3>Cards Tracked</h3>
        <p id="cardsTracked">0</p>
    </div>

    <div class="stat-card">
        <h3>Cards Sold</h3>
        <p id="cardsSold">0</p>
    </div>

    <div class="stat-card">
        <h3>Cards For Sale</h3>
        <p id="cardsForSale">0</p>
    </div>

    <div class="stat-card">
        <h3>Total Spent</h3>
        <p id="totalSpent">$0.00</p>
    </div>

    <div class="stat-card">
        <h3>Total Sales</h3>
        <p id="totalSales">$0.00</p>
    </div>

    <div class="stat-card">
        <h3>Total Profit</h3>
        <p id="totalProfit">$0.00</p>
    </div>

</section>
<section class="card-section">

<div class="section-header">
<h2>Inventory</h2>
<button id="addCardButton">+ Add Card</button>
</div>

<div class="inventory-tabs">
    <button id="unlistedTab" class="inventory-tab active">
        Unlisted
    </button>

    <button id="listedTab" class="inventory-tab">
        Listed
    </button>
</div>

<div id="cardList">
    
<div id="cardList">
<div class="empty-message">
<h3>No cards yet</h3>
<p>Click "Add Card" to add your first card.</p>
</div>
</div>

</section>

</main>

<!-- Add Card Modal -->
<div id="cardModal" class="modal">

<div class="modal-content">

<div class="modal-header">
<h2 id="modalTitle">Add Card</h2>
<button id="closeModal">&times;</button>
</div>

<form id="cardForm">

<label for="cardName">Card Name</label>
<input
type="text"
id="cardName"
placeholder="Example: 2020 Joe Burrow Mosaic RC"
required
>

<label for="buyPrice">Buy Price</label>
<input
type="number"
id="buyPrice"
placeholder="0.00"
min="0"
step="0.01"
required
>

<label for="grading">Worth Grading?</label>
<select id="grading">
<option value="yes">Yes</option>
<option value="maybe">Maybe</option>
<option value="no">No</option>
</select>

<button type="submit" class="save-button">
Add Card
</button>

</form>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
